name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      # Next's typed-routes feature (used by layout.tsx's LayoutProps) only
      # exists once Next has generated it -- normally a side effect of
      # `next dev`/`next build`, which a fresh CI checkout has never run.
      - run: npx next typegen
      - run: npm run check
